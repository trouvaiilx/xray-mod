name: Dependency Update Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Minecraft & Sodium Versions
        id: check
        run: |
          # Read current versions from gradle.properties
          CURRENT_MC=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          CURRENT_SODIUM=$(grep "^sodium_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r')

          echo "Current configured Minecraft version: $CURRENT_MC"
          echo "Current configured Sodium version: $CURRENT_SODIUM"

          # Fetch latest stable Minecraft version from Fabric Meta API
          LATEST_MC=$(curl -s https://meta.fabricmc.net/v2/versions/game | jq -r '[.[] | select(.stable == true)][0].version')
          
          # Fetch latest Sodium version from Modrinth API
          LATEST_SODIUM=$(curl -s "https://api.modrinth.com/v2/project/sodium/version" | jq -r '.[0].version_number')

          echo "Latest stable Minecraft version: $LATEST_MC"
          echo "Latest Sodium release on Modrinth: $LATEST_SODIUM"

          # Generate GitHub Step Summary
          {
            echo "# 🔄 Version & Dependency Check Summary"
            echo ""
            echo "| Dependency | Current Version | Latest Available | Status |"
            echo "| --- | --- | --- | --- |"
            if [ "$CURRENT_MC" = "$LATEST_MC" ]; then
              echo "| **Minecraft** | \`$CURRENT_MC\` | \`$LATEST_MC\` | ✅ Up to date |"
            else
              echo "| **Minecraft** | \`$CURRENT_MC\` | \`$LATEST_MC\` | 🚀 Update Available |"
            fi
            if [ "$CURRENT_SODIUM" = "$LATEST_SODIUM" ]; then
              echo "| **Sodium** | \`$CURRENT_SODIUM\` | \`$LATEST_SODIUM\` | ✅ Up to date |"
            else
              echo "| **Sodium** | \`$CURRENT_SODIUM\` | \`$LATEST_SODIUM\` | 🚀 Update Available |"
            fi
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ "$CURRENT_MC" != "$LATEST_MC" ] || [ "$CURRENT_SODIUM" != "$LATEST_SODIUM" ]; then
            echo "updates_found=true" >> $GITHUB_OUTPUT
          else
            echo "updates_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify on Updates
        if: steps.check.outputs.updates_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚀 Update Available: New Minecraft or Sodium Release Detected',
              body: 'Automated update check detected new releases available on Fabric Meta / Modrinth API.\n\nPlease check the [Action Summary](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.'
            });
