org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft version. NOTE: 26.1+ ships unobfuscated, so Loom uses official Mojang
# mappings directly (loom.officialMojangMappings() in build.gradle) -- Yarn is
# deprecated from this version onward and is NOT used here.
minecraft_version=26.2
loader_version=0.19.3
# Loom's plugin ID changed for non-obfuscated MC versions: it's net.fabricmc.fabric-loom
# (not the old bare "fabric-loom"), and as of Aug 2026 the 26.2-track build is still only
# published as a SNAPSHOT on Fabric's own maven (maven.fabricmc.net, already in
# settings.gradle) -- it is NOT on the Gradle Plugin Portal, which is why 'fabric-loom'
# version '1.17' failed to resolve.
loom_version=1.17.12

# Mod info
mod_version=1.7.0
maven_group=io.github.trouvaiilx
archives_base_name=xray-mod

# Dependencies -- verified against Modrinth/Fabric's own release notes, Aug 2026
fabric_version=0.157.0+26.2
sodium_version=mc26.2-0.9.1-fabric
